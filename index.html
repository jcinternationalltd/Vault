<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault — Product Image Database</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F5F0E8;--warm-white:#FDFAF5;--charcoal:#1C1C1C;
  --gold:#B8985A;--gold-light:#D4B97A;--muted:#8A8070;
  --border:#E0D8CC;--surface:#FFFFFF;--danger:#8B3A3A;--blue:#2D5A8A;
}
html,body{height:100%;background:var(--cream);color:var(--charcoal);font-family:'Montserrat',sans-serif;font-weight:300}
#app{display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
.hdr{background:var(--charcoal);color:var(--cream);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:72px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--gold)}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:6px;text-transform:uppercase;color:var(--gold-light)}
.logo em{font-style:italic;color:var(--cream)}
.hdr-r{display:flex;align-items:center;gap:14px}
.badge{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px solid #333;padding:6px 14px;display:flex;align-items:center;gap:8px}
.badge b{color:var(--gold-light)}
.role-pill{font-size:9px;letter-spacing:2px;padding:2px 8px;border-radius:2px;text-transform:uppercase;font-weight:500}
.role-pill.admin{background:var(--gold);color:var(--charcoal)}
.role-pill.editor{background:var(--blue);color:#fff}
.role-pill.viewer{background:#444;color:#aaa}
.btn-sm{background:none;border:1px solid #444;color:#888;padding:6px 14px;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}

/* LOGIN */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--cream)}
.login-box{background:var(--surface);border:1px solid var(--border);padding:60px 50px;max-width:460px;width:100%;box-shadow:0 4px 40px rgba(0,0,0,.06);text-align:center}
.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.big-title{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;margin-bottom:10px;line-height:1}
.sub{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:40px;line-height:1.8}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;background:#fff;border:1px solid #d0d0d0;padding:15px 20px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .25s;color:var(--charcoal);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ms-btn:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(184,152,90,.15);background:#FDFAF5}
.ms-btn:disabled{opacity:.5;cursor:not-allowed}
.login-note{margin-top:20px;font-size:11px;color:var(--muted);letter-spacing:1px;line-height:1.8}
.err-box{font-size:12px;color:var(--danger);margin-top:16px;padding:12px 16px;background:#FDF0F0;border:1px solid #E0C0C0;text-align:left;line-height:1.8}

/* TABS */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;display:flex}
.tab{padding:14px 24px;font-size:10px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Montserrat',sans-serif}
.tab:hover{color:var(--charcoal)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* TOOLBAR */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 40px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.search-inp{width:100%;border:1px solid var(--border);background:var(--warm-white);padding:9px 14px 9px 36px;font-family:'Montserrat',sans-serif;font-size:12px;outline:none;transition:border-color .2s}
.search-inp:focus{border-color:var(--gold)}
.flt{border:1px solid var(--border);background:var(--warm-white);padding:9px 30px 9px 12px;font-family:'Montserrat',sans-serif;font-size:11px;color:var(--charcoal);outline:none;cursor:pointer;min-width:120px;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238A8070' stroke-width='1.5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-color:var(--warm-white)}
.btn-add{background:var(--gold);color:var(--charcoal);border:none;padding:9px 22px;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-add:hover{background:var(--charcoal);color:var(--gold-light)}

/* GRID */
.grid-wrap{padding:28px 40px;flex:1}
.stats{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.stats b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:all .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.1);border-color:var(--gold)}
.card-img{width:100%;height:210px;background:var(--cream);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-img img{transform:scale(1.04)}
.no-img{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--border)}
.img-count{position:absolute;top:10px;right:10px;background:rgba(28,28,28,.75);color:var(--gold-light);font-size:10px;letter-spacing:1px;padding:4px 8px}
.card-body{padding:16px 18px 18px}
.style-no{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;margin-bottom:6px;letter-spacing:1px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{font-size:9px;letter-spacing:2px;text-transform:uppercase;background:var(--cream);color:var(--muted);border:1px solid var(--border);padding:3px 7px}
.tag.g{background:#FBF5E6;color:var(--gold);border-color:var(--gold-light)}
.card-meta{font-size:11px;color:var(--muted);letter-spacing:1px}

/* EMPTY */
.empty{text-align:center;padding:80px 40px;color:var(--muted)}
.empty-ico{font-size:48px;margin-bottom:16px;opacity:.4}
.empty h3{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--charcoal);margin-bottom:8px}
.empty p{font-size:12px;letter-spacing:1px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .2s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;border:1px solid var(--border);animation:su .25s ease}
@keyframes su{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{padding:26px 30px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
.modal-body{padding:26px 30px}
.modal-ftr{padding:18px 30px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn-x{background:none;border:none;cursor:pointer;color:var(--muted);font-size:24px;line-height:1;padding:2px;transition:color .2s}
.btn-x:hover{color:var(--charcoal)}
.btn-sec{background:none;border:1px solid var(--border);color:var(--muted);padding:10px 22px;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-sec:hover{border-color:var(--charcoal);color:var(--charcoal)}
.btn-del{background:none;border:1px solid #C0A0A0;color:var(--danger);padding:10px 22px;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-del:hover{background:var(--danger);color:#fff}
.btn-primary{background:var(--charcoal);color:var(--gold-light);border:none;padding:10px 28px;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-primary:hover{background:var(--gold);color:var(--charcoal)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.fld{margin-bottom:18px}
.lbl{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.inp{width:100%;border:1px solid var(--border);background:var(--warm-white);padding:11px 14px;font-family:'Montserrat',sans-serif;font-size:12px;color:var(--charcoal);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--gold)}
select.inp{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238A8070' stroke-width='1.5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-color:var(--warm-white);cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;margin-top:22px;border-bottom:1px solid var(--border);padding-bottom:8px}
.sec-title:first-child{margin-top:0}

/* IMAGES */
.img-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.thumb{aspect-ratio:1;background:var(--cream);border:1px solid var(--border);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-del{position:absolute;top:4px;right:4px;background:rgba(139,58,58,.85);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.thumb:hover .thumb-del{opacity:1}
.drop-zone{border:2px dashed var(--border);padding:24px;text-align:center;cursor:pointer;transition:all .2s;color:var(--muted);font-size:12px;letter-spacing:1px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--gold);color:var(--gold);background:#FBF5E6}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.detail-img{aspect-ratio:1;overflow:hidden;border:1px solid var(--border);cursor:pointer}
.detail-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.detail-img:hover img{transform:scale(1.06)}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.attr{padding:12px 14px;background:var(--cream);border:1px solid var(--border)}
.attr-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.attr-val{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--charcoal)}
.meta-info{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:18px;line-height:1.8}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain}
.lb-close{position:absolute;top:22px;right:30px;background:none;border:none;color:#fff;font-size:34px;cursor:pointer;opacity:.7;line-height:1}
.lb-close:hover{opacity:1}

/* TOAST */
.toast{position:fixed;bottom:30px;right:30px;background:var(--charcoal);color:var(--cream);padding:13px 20px;font-size:12px;letter-spacing:1px;border-left:3px solid var(--gold);z-index:400;animation:sl .3s ease}
@keyframes sl{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}

/* SPINNER */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ADMIN */
.admin-wrap{padding:28px 40px;flex:1}
.admin-section{background:var(--surface);border:1px solid var(--border);margin-bottom:24px}
.admin-section-hdr{padding:16px 22px;border-bottom:1px solid var(--border)}
.admin-section-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;letter-spacing:1px}
.admin-section-sub{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.user-table{width:100%;border-collapse:collapse}
.user-table th{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);padding:10px 22px;text-align:left;border-bottom:1px solid var(--border);background:var(--cream)}
.user-table td{padding:13px 22px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.user-table tr:last-child td{border-bottom:none}
.user-table tr:hover td{background:var(--warm-white)}
.role-sel{border:1px solid var(--border);background:var(--warm-white);padding:5px 24px 5px 10px;font-family:'Montserrat',sans-serif;font-size:11px;color:var(--charcoal);outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='8' height='5' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238A8070' stroke-width='1.5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;background-color:var(--warm-white)}
.activity-row{padding:12px 22px;border-bottom:1px solid var(--border);font-size:12px;display:flex;align-items:flex-start;gap:14px}
.activity-row:last-child{border-bottom:none}
.act-ico{font-size:16px;margin-top:1px;flex-shrink:0}
.act-text{flex:1;line-height:1.6}
.act-time{font-size:10px;color:var(--muted);letter-spacing:1px;white-space:nowrap}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:18px 22px}
.stat-card{text-align:center;padding:20px;background:var(--cream);border:1px solid var(--border)}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;color:var(--gold);line-height:1}
.stat-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:6px}

@media(max-width:600px){
  .hdr{padding:0 16px}
  .toolbar,.tabs{padding-left:16px;padding-right:16px}
  .grid-wrap,.admin-wrap{padding:16px}
  .form-row{grid-template-columns:1fr}
  .modal-hdr,.modal-body,.modal-ftr{padding-left:16px;padding-right:16px}
  .login-box{padding:36px 24px}
}
</style>
</head>
<body>

<!-- Initial loading screen shown before JS runs -->
<div id="app">
  <header class="hdr">
    <div class="logo">The <em>Vault</em></div>
  </header>
  <div class="login-wrap">
    <div class="login-box">
      <div class="eyebrow">Product Image Database</div>
      <div class="big-title">The Vault</div>
      <div class="sub">Loading Microsoft login…</div>
      <div style="display:flex;justify-content:center;padding:10px 0">
        <div style="width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────
// CONFIGURATION
// ─────────────────────────────────────────────
var CLIENT_ID = '37ac80f6-8ceb-4588-bc18-5106c74901b2';
var TENANT_ID = 'ad762713-64b8-4d19-b5cf-309d7d422ee2';

var LEATHER_OPTIONS = ['Calfskin','Lambskin','Saffiano','Pebbled','Suede','Patent','Exotic','Vegan','Full Grain','Top Grain'];
var TYPE_OPTIONS    = ['Tote','Shoulder Bag','Crossbody','Clutch','Backpack','Satchel','Hobo','Mini Bag','Belt Bag','Bifold Wallet','Trifold Wallet','Card Holder','Zip Wallet','Long Wallet'];
var SEX_OPTIONS     = ["Women's","Men's","Unisex"];
var COLOUR_OPTIONS  = ['Black','White','Tan','Camel','Cognac','Navy','Burgundy','Red','Pink','Green','Grey','Brown','Cream','Gold','Silver','Multi'];
var ROLES           = ['admin','editor','viewer'];

// ─────────────────────────────────────────────
// LOCAL STORAGE
// ─────────────────────────────────────────────
var K_PRODUCTS  = 'vault:products';
var K_USERS     = 'vault:users';
var K_ACTIVITY  = 'vault:activity';

function dbGet(k) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}
function dbSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}
function getProducts()  { return dbGet(K_PRODUCTS)  || {}; }
function getUsers()     { return dbGet(K_USERS)     || {}; }
function getActivity()  { return dbGet(K_ACTIVITY)  || []; }

function ensureUser(account) {
  var users = getUsers();
  var id    = account.localAccountId || account.homeAccountId;
  var name  = account.name || account.username;
  var email = account.username;
  if (!users[id]) {
    var isFirst = Object.keys(users).length === 0;
    users[id] = { id:id, name:name, email:email, role: isFirst ? 'admin' : 'viewer', firstSeen:Date.now(), lastSeen:Date.now() };
  } else {
    users[id].lastSeen = Date.now();
    users[id].name     = name;
  }
  dbSet(K_USERS, users);
  return users[id];
}

function logActivity(type, detail, userName) {
  var log = getActivity();
  log.unshift({ type:type, detail:detail, user:userName, time:Date.now() });
  if (log.length > 200) log.length = 200;
  dbSet(K_ACTIVITY, log);
}

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
var S = {
  msAccount:    null,
  vaultUser:    null,
  products:     {},
  search:       '',
  filters:      { leather:'', type:'', sex:'', colour:'' },
  tab:          'products',
  modal:        null,
  selected:     null,
  lightbox:     null,
  toast:        null,
  toastTimer:   null,
  saving:       false,
  loginLoading: false,
  loginError:   '',
  form:         { styleNo:'', leather:'', dimensions:'', type:'', sex:'', colour:'' },
  pendingImages: []
};

function setState(patch) {
  Object.assign(S, patch);
  render();
}

function canEdit() { return S.vaultUser && (S.vaultUser.role === 'admin' || S.vaultUser.role === 'editor'); }
function isAdmin() { return S.vaultUser && S.vaultUser.role === 'admin'; }

// ─────────────────────────────────────────────
// MSAL — POPUP MODE
// ─────────────────────────────────────────────
var msalApp = null;

function createMsalApp() {
  return new msal.PublicClientApplication({
    auth: {
      clientId:    CLIENT_ID,
      authority:   'https://login.microsoftonline.com/' + TENANT_ID,
      redirectUri: 'https://jcinternationalltd.github.io/Vault/'
    },
    cache: {
      cacheLocation:        'localStorage',
      storeAuthStateInCookie: true
    }
  });
}

function signIn() {
  if (!msalApp) { showToast('App not ready yet, please wait a moment'); return; }
  setState({ loginLoading:true, loginError:'' });
  msalApp.loginPopup({ scopes: ['User.Read', 'openid', 'profile', 'email'], prompt: 'select_account' })
    .then(function(resp) {
      if (resp && resp.account) {
        msalApp.setActiveAccount(resp.account);
        var vu = ensureUser(resp.account);
        logActivity('login', 'Signed in', vu.name);
        setState({ msAccount:resp.account, vaultUser:vu, products:getProducts(), loginLoading:false, loginError:'' });
      } else {
        setState({ loginLoading:false, loginError:'No account returned. Please try again.' });
      }
    })
    .catch(function(err) {
      var msg = 'Sign in failed. ';
      if (err.message && err.message.indexOf('popup') !== -1) {
        msg = 'Your browser blocked the popup. Please click "Allow" when prompted, or check your browser settings to allow popups for this site, then try again.';
      } else if (err.message && err.message.indexOf('cancel') !== -1) {
        msg = 'Sign in was cancelled. Please try again.';
      } else if (err.message && err.message.indexOf('AADSTS') !== -1) {
        msg = 'Microsoft returned an error: ' + err.message;
      } else {
        msg += (err.message || 'Unknown error. Please try again.');
      }
      setState({ loginLoading:false, loginError:msg });
    });
}

function signOut() {
  if (!msalApp || !S.msAccount) return;
  logActivity('logout', 'Signed out', S.vaultUser ? S.vaultUser.name : '');
  msalApp.logoutPopup({ account: S.msAccount })
    .catch(function() {})
    .finally(function() {
      setState({ msAccount:null, vaultUser:null, products:{}, modal:null, tab:'products', loginError:'' });
    });
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function showToast(msg) {
  if (S.toastTimer) clearTimeout(S.toastTimer);
  var t = setTimeout(function() { setState({ toast:null, toastTimer:null }); }, 3000);
  setState({ toast:msg, toastTimer:t });
}

function readFile(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload  = function() { resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function handleFilesPending(files) {
  var promises = Array.from(files).map(readFile);
  Promise.all(promises).then(function(dataUrls) {
    var newItems = Array.from(files).map(function(f, i) { return { name:f.name, dataUrl:dataUrls[i] }; });
    setState({ pendingImages: S.pendingImages.concat(newItems) });
  });
}

function getFiltered() {
  var q = S.search.toLowerCase();
  return Object.values(S.products).filter(function(p) {
    var matchSearch = !q
      || p.styleNo.toLowerCase().indexOf(q) !== -1
      || (p.colour  || '').toLowerCase().indexOf(q) !== -1
      || (p.type    || '').toLowerCase().indexOf(q) !== -1
      || (p.leather || '').toLowerCase().indexOf(q) !== -1;
    return matchSearch
      && (!S.filters.leather || p.leather === S.filters.leather)
      && (!S.filters.type    || p.type    === S.filters.type)
      && (!S.filters.sex     || p.sex     === S.filters.sex)
      && (!S.filters.colour  || p.colour  === S.filters.colour);
  });
}

// PRODUCT ACTIONS
// ─────────────────────────────────────────────
function saveProduct() {
  if (!S.form.styleNo.trim()) { showToast('Style number is required'); return; }
  setState({ saving:true });
  var key  = S.form.styleNo.trim().toUpperCase();
  var all  = getProducts();
  var ex   = all[key] || {};
  var imgs = S.pendingImages.map(function(p) { return p.dataUrl; });
  all[key] = {
    styleNo:    key,
    leather:    S.form.leather,
    dimensions: S.form.dimensions,
    type:       S.form.type,
    sex:        S.form.sex,
    colour:     S.form.colour,
    images:     (ex.images || []).concat(imgs),
    updatedBy:  S.vaultUser.name,
    updatedAt:  Date.now(),
    createdAt:  ex.createdAt  || Date.now(),
    createdBy:  ex.createdBy  || S.vaultUser.name
  };
  dbSet(K_PRODUCTS, all);
  logActivity('add', 'Added style ' + key, S.vaultUser.name);
  setState({ products:all, modal:null, pendingImages:[], saving:false, form:{styleNo:'',leather:'',dimensions:'',type:'',sex:'',colour:''} });
  showToast('Style ' + key + ' saved');
}

function saveEdit() {
  setState({ saving:true });
  var key  = S.selected.styleNo;
  var all  = getProducts();
  var ex   = all[key] || S.selected;
  var imgs = S.pendingImages.map(function(p) { return p.dataUrl; });
  all[key] = Object.assign({}, ex, {
    leather:    S.form.leather,
    dimensions: S.form.dimensions,
    type:       S.form.type,
    sex:        S.form.sex,
    colour:     S.form.colour,
    images:     (ex.images || []).concat(imgs),
    updatedBy:  S.vaultUser.name,
    updatedAt:  Date.now()
  });
  dbSet(K_PRODUCTS, all);
  logActivity('edit', 'Edited style ' + key, S.vaultUser.name);
  setState({ products:all, selected:all[key], modal:'detail', pendingImages:[], saving:false });
  showToast('Product updated');
}

function deleteImage(key, idx) {
  var all = getProducts();
  all[key].images = all[key].images.filter(function(_, i) { return i !== idx; });
  dbSet(K_PRODUCTS, all);
  logActivity('img-del', 'Removed image from ' + key, S.vaultUser.name);
  setState({ products:all, selected:all[key] });
  showToast('Image removed');
}

function deleteProduct(key) {
  if (!confirm('Delete style ' + key + '? This cannot be undone.')) return;
  var all = getProducts();
  delete all[key];
  dbSet(K_PRODUCTS, all);
  logActivity('del', 'Deleted style ' + key, S.vaultUser.name);
  setState({ products:all, modal:null, selected:null });
  showToast('Style ' + key + ' deleted');
}

function addImagesToExisting(key, files) {
  setState({ saving:true });
  Promise.all(Array.from(files).map(readFile)).then(function(imgs) {
    var all = getProducts();
    all[key].images    = (all[key].images || []).concat(imgs);
    all[key].updatedAt = Date.now();
    all[key].updatedBy = S.vaultUser.name;
    dbSet(K_PRODUCTS, all);
    logActivity('img-add', 'Added ' + imgs.length + ' image(s) to ' + key, S.vaultUser.name);
    setState({ products:all, selected:all[key], saving:false });
    showToast(imgs.length + ' image(s) added');
  });
}

function updateUserRole(userId, role) {
  var users = getUsers();
  if (!users[userId]) return;
  if (users[userId].role === 'admin' && role !== 'admin') {
    var adminCount = Object.values(users).filter(function(u) { return u.role === 'admin'; }).length;
    if (adminCount <= 1) { showToast('Cannot remove the last admin'); return; }
  }
  users[userId].role = role;
  dbSet(K_USERS, users);
  logActivity('role', "Changed " + users[userId].name + "'s role to " + role, S.vaultUser.name);
  if (userId === S.vaultUser.id) {
    setState({ vaultUser: Object.assign({}, S.vaultUser, { role:role }) });
  } else {
    render();
  }
  showToast('Role updated');
}

// ─────────────────────────────────────────────
// DOM HELPER
// ─────────────────────────────────────────────
function h(tag, attrs) {
  var el   = document.createElement(tag);
  var kids = Array.prototype.slice.call(arguments, 2);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k) {
    var v = attrs[k];
    if (k === 'class')                   { el.className = v; }
    else if (k.indexOf('on') === 0)      { el.addEventListener(k.slice(2).toLowerCase(), v); }
    else if (k === 'style' && typeof v === 'object') { Object.assign(el.style, v); }
    else if (k === 'disabled' && v)      { el.disabled = true; }
    else if (k === 'checked'  && v)      { el.checked  = true; }
    else if (k === 'selected' && v)      { el.selected = true; }
    else                                 { el.setAttribute(k, v); }
  });
  kids.forEach(function append(c) {
    if (c == null || c === false) return;
    if (Array.isArray(c))        { c.forEach(append); return; }
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

function fld(label, inputEl) {
  return h('div', {'class':'fld'}, h('label', {'class':'lbl'}, label), inputEl);
}

function mkSelect(options, value, onChange, placeholder) {
  var s = h('select', {'class':'inp', onchange:onChange});
  if (placeholder) s.appendChild(h('option', {value:''}, placeholder));
  options.forEach(function(o) {
    var attrs = {value:o};
    if (o === value) attrs.selected = true;
    s.appendChild(h('option', attrs, o));
  });
  return s;
}

function rolePill(role) {
  return h('span', {'class':'role-pill ' + role}, role);
}

function fileInput(multiple, onFiles) {
  var fi = document.createElement('input');
  fi.type     = 'file';
  fi.multiple = multiple;
  fi.accept   = 'image/*';
  fi.style.display = 'none';
  fi.addEventListener('change', function() { onFiles(Array.from(fi.files)); fi.value = ''; });
  return fi;
}

function makeDZ(label, onFiles) {
  var dz = h('div', {'class':'drop-zone'}, '📸 ', label);
  dz.addEventListener('click', function() {
    var fi = fileInput(true, onFiles);
    document.body.appendChild(fi);
    fi.click();
    setTimeout(function() { document.body.removeChild(fi); }, 10000);
  });
  dz.addEventListener('dragover',  function(e) { e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', function()  { dz.classList.remove('drag'); });
  dz.addEventListener('drop', function(e) {
    e.preventDefault();
    dz.classList.remove('drag');
    var files = Array.from(e.dataTransfer.files).filter(function(f) { return f.type.indexOf('image/') === 0; });
    onFiles(files);
  });
  return dz;
}

}

// ── Grid ──
function renderGrid() {
  var filtered = getFiltered();
  var total    = Object.keys(S.products).length;
  var wrap     = h('div', {'class':'grid-wrap'});

  if (total === 0) {
    wrap.appendChild(h('div', {'class':'empty'},
      h('div', {'class':'empty-ico'}, '👜'),
      h('h3', null, 'The Vault is Empty'),
      h('p',  null, canEdit() ? 'Add your first product style to get started.' : 'No products have been added yet.')
    ));
    return wrap;
  }

  if (filtered.length === 0) {
    wrap.appendChild(h('div', {'class':'empty'},
      h('div', {'class':'empty-ico'}, '🔍'),
      h('h3', null, 'No Results Found'),
      h('p',  null, 'Try adjusting your search or filters.')
    ));
    return wrap;
  }

  wrap.appendChild(h('div', {'class':'stats'}, h('b', null, String(filtered.length)), ' of ', String(total), ' style' + (total !== 1 ? 's' : '')));

  var grid = h('div', {'class':'grid'});
  filtered.forEach(function(p) {
    var iw = h('div', {'class':'card-img'});
    if (p.images && p.images.length > 0) {
      iw.appendChild(h('img', {src:p.images[0], alt:p.styleNo}));
      if (p.images.length > 1) iw.appendChild(h('div', {'class':'img-count'}, p.images.length + ' photos'));
    } else {
      iw.appendChild(h('div', {'class':'no-img'}, h('div', null, '📷'), h('span', {style:{fontSize:'11px'}}, 'No Image')));
    }

    var tags = h('div', {'class':'tags'});
    if (p.type)    tags.appendChild(h('span', {'class':'tag g'}, p.type));
    if (p.sex)     tags.appendChild(h('span', {'class':'tag'},   p.sex));
    if (p.leather) tags.appendChild(h('span', {'class':'tag'},   p.leather));
    if (p.colour)  tags.appendChild(h('span', {'class':'tag'},   p.colour));

    var card = h('div', {'class':'card', onclick:function(){ setState({modal:'detail', selected:p}); }},
      iw,
      h('div', {'class':'card-body'},
        h('div', {'class':'style-no'}, '#' + p.styleNo),
        tags,
        p.dimensions ? h('div', {'class':'card-meta'}, p.dimensions) : null
      )
    );
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  return wrap;
}

// ── Image section (used in add / edit modals) ──
function renderImgSection(existing, allowDel, styleKey) {
  var frag = document.createDocumentFragment();

  if (existing && existing.length > 0) {
    frag.appendChild(h('div', {'class':'sec-title'}, 'Current Images'));
    var g = h('div', {'class':'img-gallery'});
    existing.forEach(function(img, i) {
      var th = h('div', {'class':'thumb'}, h('img', {src:img, alt:''}));
      if (allowDel && canEdit()) {
        (function(idx) {
          var del = h('button', {'class':'thumb-del', onclick:function(e){ e.stopPropagation(); deleteImage(styleKey, idx); }}, '×');
          th.appendChild(del);
        })(i);
      }
      g.appendChild(th);
    });
    frag.appendChild(g);
  }

  if (S.pendingImages.length > 0) {
    frag.appendChild(h('div', {'class':'sec-title'}, 'Pending Upload'));
    var pg = h('div', {'class':'img-gallery'});
    S.pendingImages.forEach(function(p, i) {
      var th = h('div', {'class':'thumb'}, h('img', {src:p.dataUrl, alt:''}));
      (function(idx) {
        var del = h('button', {'class':'thumb-del', onclick:function(){ var n=S.pendingImages.slice(); n.splice(idx,1); setState({pendingImages:n}); }}, '×');
        th.appendChild(del);
      })(i);
      pg.appendChild(th);
    });
    frag.appendChild(pg);
  }

  frag.appendChild(h('div', {'class':'sec-title'}, 'Add Images'));
  frag.appendChild(makeDZ('Drop images here or click to browse', handleFilesPending));
  return frag;
}

    h('button', {'class':'lb-close', onclick:function(){ setState({lightbox:null}); }}, '×'),
    h('img', {src:S.lightbox, alt:'', onclick:function(e){ e.stopPropagation(); }})
  );
}

// ── Admin panel ──
function renderAdmin() {
  var users    = getUsers();
  var activity = getActivity();
  var products = getProducts();
  var wrap     = h('div', {'class':'admin-wrap'});

  // Stats
  var ss = h('div', {'class':'admin-section'});
  ss.appendChild(h('div', {'class':'admin-section-hdr'}, h('div', {'class':'admin-section-title'}, 'Overview')));
  var sc = h('div', {'class':'stat-cards'});
  var totalStyles = Object.keys(products).length;
  var totalImgs   = Object.values(products).reduce(function(a,p){ return a + (p.images ? p.images.length : 0); }, 0);
  var totalUsers  = Object.keys(users).length;
  [[totalStyles,'Styles'],[totalImgs,'Images'],[totalUsers,'Users']].forEach(function(pair) {
    sc.appendChild(h('div', {'class':'stat-card'}, h('div',{'class':'stat-num'},String(pair[0])), h('div',{'class':'stat-lbl'},pair[1])));
  });
  ss.appendChild(sc);
  wrap.appendChild(ss);

  // Users table
  var us = h('div', {'class':'admin-section'});
  us.appendChild(h('div', {'class':'admin-section-hdr'},
    h('div', {'class':'admin-section-title'}, 'User Access'),
    h('div', {'class':'admin-section-sub'}, 'Manage roles for everyone who has signed in')
  ));
  var table = h('table', {'class':'user-table'});
  table.appendChild(h('thead', null, h('tr', null,
    h('th',null,'Name'), h('th',null,'Email'), h('th',null,'Role'), h('th',null,'Last Seen')
  )));
  var tbody = h('tbody', null);
  Object.values(users).forEach(function(u) {
    var rs = h('select', {'class':'role-sel', onchange:function(e){ updateUserRole(u.id, e.target.value); }});
    ROLES.forEach(function(r) {
      var at = {value:r};
      if (r === u.role) at.selected = true;
      rs.appendChild(h('option', at, r.charAt(0).toUpperCase() + r.slice(1)));
    });
    if (u.id === S.vaultUser.id) rs.disabled = true;
    var lastSeen = u.lastSeen ? new Date(u.lastSeen).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    var nameCell = u.id === S.vaultUser.id ? h('b', null, u.name + ' (you)') : document.createTextNode(u.name);
    tbody.appendChild(h('tr', null,
      h('td', null, nameCell),
      h('td', {style:{color:'var(--muted)'}}, u.email),
      h('td', null, rs),
      h('td', {style:{color:'var(--muted)',fontSize:'11px'}}, lastSeen)
    ));
  });
  table.appendChild(tbody);
  us.appendChild(table);
  wrap.appendChild(us);

  // Role legend
  var ls = h('div', {'class':'admin-section'});
  ls.appendChild(h('div', {'class':'admin-section-hdr'}, h('div',{'class':'admin-section-title'},'Role Permissions')));
  var lb = h('div', {style:{padding:'14px 22px'}});
  [
    ['admin',  'Full access — view, add, edit, delete products and manage all users'],
    ['editor', 'Can view, add and edit products. Cannot delete or manage users'],
    ['viewer', 'Read-only — can browse and search but cannot make any changes']
  ].forEach(function(pair) {
    lb.appendChild(h('div', {style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 0',borderBottom:'1px solid var(--border)'}},
      rolePill(pair[0]),
      h('span', {style:{fontSize:'12px',color:'var(--muted)',letterSpacing:'1px'}}, pair[1])
    ));
  });
  ls.appendChild(lb);
  wrap.appendChild(ls);

  // Activity log
  var as = h('div', {'class':'admin-section'});
  as.appendChild(h('div', {'class':'admin-section-hdr'},
    h('div', {'class':'admin-section-title'}, 'Activity Log'),
    h('div', {'class':'admin-section-sub'}, 'Last 50 actions')
  ));
  var icons = {add:'➕',edit:'✏️',del:'🗑️','img-add':'📸','img-del':'🖼️',login:'🔑',logout:'🚪',role:'👤'};
  if (!activity.length) {
    as.appendChild(h('div', {style:{padding:'24px',textAlign:'center',color:'var(--muted)',fontSize:'12px'}}, 'No activity yet'));
  } else {
    activity.slice(0, 50).forEach(function(a) {
      var t = new Date(a.time).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      as.appendChild(h('div', {'class':'activity-row'},
        h('span', {'class':'act-ico'}, icons[a.type] || '•'),
        h('div',  {'class':'act-text'}, h('b',null,a.user), ' — ', a.detail),
        h('span', {'class':'act-time'}, t)
      ));
    });
  }
  wrap.appendChild(as);
  return wrap;
}

function showFatalError(msg) {
  document.getElementById('app').innerHTML =
    '<header class="hdr"><div class="logo">The <em>Vault</em></div></header>' +
    '<div class="login-wrap"><div class="login-box">' +
    '<div class="eyebrow" style="color:var(--danger)">Error</div>' +
    '<div class="big-title" style="margin-bottom:20px">Cannot Load</div>' +
    '<div class="err-box">' + msg + '</div>' +
    '<button onclick="location.reload()" style="margin-top:20px;width:100%;background:var(--charcoal);color:var(--gold-light);border:none;padding:13px;font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer">&#8635; Refresh</button>' +
    '</div></div>';
}

function boot() {
  // Must have internet (MSAL loaded from CDN)
  if (typeof msal === 'undefined') {
    showFatalError('The Microsoft login library failed to load. Please check your internet connection and refresh the page.');
    return;
  }

  // Create MSAL instance
  try {
    msalApp = createMsalApp();
  } catch(e) {
    showFatalError('Failed to create Microsoft login: ' + e.message);
    return;
  }

  // Initialise, then check for existing session
  msalApp.initialize()
    .then(function() {
      var accounts = msalApp.getAllAccounts();
      if (accounts.length > 0) {
        msalApp.setActiveAccount(accounts[0]);
        var vu = ensureUser(accounts[0]);
        setState({ msAccount:accounts[0], vaultUser:vu, products:getProducts() });
      } else {
        // No session — show login screen
        setState({});
      }
    })
    .catch(function(e) {
      showFatalError('Microsoft login initialisation failed: ' + (e.message || 'Unknown error') + '<br><br>Please refresh the page and try again.');
    });
}

boot();
</script>
